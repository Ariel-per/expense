<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>費用簽核</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#eceff2; --surface:#ffffff; --ink:#17212b; --muted:#6b7480; --line:#d8dde3;
    --brand:#0f5c6e; --brand-ink:#ffffff; --ok:#2f7d4f; --bad:#b3261e; --wait:#a8670f; --gray:#7d8590; --paid:#2b5fa8;
    --soft-ok:#e3f1e8; --soft-bad:#f8e3e1; --soft-wait:#f7ecd9; --soft-gray:#eceef1; --soft-paid:#e2eaf6; --soft-brand:#e1eef1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12171c; --surface:#1b2229; --ink:#e7ecf0; --muted:#97a1ab; --line:#2c353e;
      --brand:#3fa3b8; --brand-ink:#0b1a1f; --ok:#5cbf83; --bad:#ef7b70; --wait:#e2a64c; --gray:#9aa3ad; --paid:#7aa7e8;
      --soft-ok:#1d3326; --soft-bad:#3a2220; --soft-wait:#3a2d17; --soft-gray:#252c33; --soft-paid:#1d2a3d; --soft-brand:#183039;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55;
       padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .num{font-variant-numeric:tabular-nums}
  header{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;display:flex;justify-content:space-between;align-items:baseline}
  header h1{font-size:20px;margin:0;font-weight:700}
  header .who{font-size:13px;color:var(--muted)}
  main{max-width:560px;margin:0 auto;padding:0 14px}
  .panel{background:var(--surface);border-radius:14px;padding:18px;margin-bottom:12px}
  .hidden{display:none!important}

  label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  label.f:first-child{margin-top:0}
  input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:10px;padding:11px 12px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
  textarea{min-height:76px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:13px;color:var(--muted);margin:0 0 10px}

  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:4px}
  .seg input{display:none}
  .seg span{display:block;text-align:center;padding:9px;border-radius:8px;font-weight:500;color:var(--muted)}
  .seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px dashed var(--line);padding:4px 2px 8px}
  .amount b{font-size:18px;color:var(--muted);font-weight:500}
  .amount input{background:none;border:none;padding:0;font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .amount:focus-within{border-bottom-color:var(--brand)}

  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .photo{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--bg)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:26px;padding:0}
  .cap{position:absolute;left:0;right:0;bottom:0;padding:5px 7px;font-size:12px;color:#fff;background:rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
  .cap.reading{background:rgba(15,92,110,.85)}
  .cap.fail{background:rgba(179,38,30,.85)}
  .add{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:13px;gap:4px;cursor:pointer;text-align:center;padding:4px}
  .add svg{width:26px;height:26px}

  .recog{list-style:none;margin:12px 0 0;padding:12px 14px;background:var(--soft-brand);border-radius:10px;font-size:14px}
  .recog li + li{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .recog span{color:var(--muted);font-size:13px}
  .warn{list-style:none;margin:8px 0 0;padding:10px 14px;background:var(--soft-bad);color:var(--bad);border-radius:10px;font-size:14px}
  .warn li + li{margin-top:4px}

  .btn{display:block;width:100%;font:inherit;font-weight:700;border:none;border-radius:12px;padding:14px;margin-top:18px;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
  .btn:disabled{opacity:.5}
  .btn.ok{background:var(--ok);color:#fff}
  .btn.bad{background:var(--bad);color:#fff}
  .btn.ghost{background:transparent;color:var(--bad);border:1px solid var(--line)}
  .btn:focus-visible,.item:focus-visible,.tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btnrow .btn{margin-top:12px}

  .item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--surface);border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
  .item .t{font-weight:500}
  .item .s{font-size:13px;color:var(--muted)}
  .item .a{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .item .flag{color:var(--bad);font-size:12px;margin-left:6px}
  .empty{text-align:center;color:var(--muted);padding:48px 12px}

  .pill{display:inline-block;font-size:12px;font-weight:500;border-radius:999px;padding:2px 10px;justify-self:end}
  .p-簽核中,.p-待簽{background:var(--soft-wait);color:var(--wait)}
  .p-已核准,.p-核准{background:var(--soft-ok);color:var(--ok)}
  .p-已退回,.p-退回{background:var(--soft-bad);color:var(--bad)}
  .p-已撤回,.p-取消,.p-未到,.p-已作廢{background:var(--soft-gray);color:var(--gray)}
  .p-已付款{background:var(--soft-paid);color:var(--paid)}

  dl{display:grid;grid-template-columns:5.5em 1fr;gap:8px 12px;margin:0}
  dt{color:var(--muted);font-size:14px}
  dd{margin:0;word-break:break-word}
  .bigamt{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 14px}
  .bigamt small{font-size:15px;color:var(--muted);font-weight:500;margin-right:6px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 10px}
  .flow{list-style:none;margin:0;padding:0}
  .flow li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
  .flow li:first-child{border-top:none;padding-top:0}
  .flow .c{grid-column:1/-1;font-size:14px;color:var(--muted)}

  nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{flex:1;background:none;border:none;font:inherit;font-size:13px;color:var(--muted);padding:10px 0 9px;position:relative;cursor:pointer}
  .tab.on{color:var(--brand);font-weight:700}
  .badge{position:absolute;top:5px;left:calc(50% + 24px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0 5px}

  .toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:40}
  .viewer img{max-width:100%;max-height:100%}
  .center{text-align:center;color:var(--muted);padding:60px 16px}
  .back{background:none;border:none;font:inherit;color:var(--brand);padding:4px 0 12px;cursor:pointer}
  /* 管理頁 */
  body.wide main{max-width:1120px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
  .fgrid .wide2{grid-column:span 2}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .btn.sm{display:inline-block;width:auto;margin:0;padding:10px 16px;font-size:15px}
  .btn.sec{background:var(--soft-brand);color:var(--brand)}
  .btn.warnbtn{background:transparent;color:var(--bad);border:1px solid var(--line)}
  .agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
  .agrid .item{margin:0;grid-template-columns:auto 1fr auto;align-items:start}
  .agrid .item .chk{grid-row:span 3;padding-top:2px}
  .agrid .item .chk input{width:20px;height:20px;padding:0;accent-color:var(--brand)}
  .agrid .item .s,.agrid .item .t{grid-column:2}
  .agrid .item .a,.agrid .item .pill{grid-column:3}
  .sumline{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin:0 2px 10px}
  .sumline b{color:var(--ink);font-variant-numeric:tabular-nums}
  @media (max-width:520px){ .fgrid .wide2{grid-column:auto} }
  /* 自訂確認框 */
  .dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
  .dlg{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px 20px 16px;width:100%;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .dlg p{margin:0 0 18px;font-size:16px;line-height:1.6;text-align:center}
  .dlg .btnrow .btn{margin-top:0;padding:12px}
  .dlg .btn.cancel{background:var(--bg);color:var(--ink)}
  @media (prefers-reduced-motion: no-preference){ .cap.reading{animation:pulse 1.4s ease-in-out infinite} }
  @keyframes pulse{50%{opacity:.6}}
</style>
</head>
<body>
<header>
  <h1 id="title">費用簽核</h1>
  <span class="who" id="who"></span>
</header>

<main>
  <div id="v-loading" class="center">載入中…</div>

  <div id="v-error" class="hidden">
    <div class="panel">
      <p id="errMsg" style="margin:0"></p>
      <button class="btn" onclick="location.reload()">重新載入</button>
    </div>
  </div>

  <!-- 綁定 -->
  <div id="v-bind" class="hidden">
    <div class="panel">
      <p class="hint">第一次使用，請輸入員工編號和管理部提供的綁定碼。</p>
      <label class="f" for="bEmp">員工編號</label>
      <input id="bEmp" autocomplete="off">
      <label class="f" for="bCode">綁定碼</label>
      <input id="bCode" autocomplete="off">
      <button class="btn" id="bBtn" onclick="doBind()">綁定</button>
    </div>
  </div>

  <!-- 申請 -->
  <div id="v-apply" class="hidden">
    <div class="panel">
      <label class="f">收據照片 <span id="photoCount"></span></label>
      <p class="hint">先拍收據，金額、日期、品項會自動帶入下方欄位。電子發票請讓兩個 QR code 清楚入鏡。</p>
      <div class="photos" id="photos"></div>
      <input type="file" id="aFile" accept="image/*" multiple class="hidden">
      <div id="ocrBox"></div>
    </div>

    <div class="panel">
      <label class="f">單別</label>
      <div class="seg" id="aType"></div>

      <label class="f" for="aAmount">金額</label>
      <div class="amount"><b>NT$</b><input id="aAmount" inputmode="numeric" placeholder="0"></div>

      <div class="row2">
        <div>
          <label class="f" for="aDate">費用日期</label>
          <input id="aDate" type="date">
        </div>
        <div>
          <label class="f" for="aCat">類別</label>
          <select id="aCat"></select>
        </div>
      </div>

      <label class="f" for="aDesc">說明</label>
      <textarea id="aDesc" placeholder="例如：拜訪台中工地計程車來回"></textarea>

      <button class="btn" id="aBtn" onclick="doSubmit()">送出申請</button>
    </div>
  </div>

  <div id="v-mine" class="hidden"><div id="mineList"></div></div>
  <div id="v-pending" class="hidden"><div id="pendList"></div></div>

  <!-- 管理 -->
  <div id="v-admin" class="hidden">
    <div class="panel">
      <div class="fgrid">
        <div><label class="f" for="fFrom">申請日期起</label><input type="date" id="fFrom"></div>
        <div><label class="f" for="fTo">申請日期迄</label><input type="date" id="fTo"></div>
        <div><label class="f" for="fCo">公司</label><select id="fCo"></select></div>
        <div><label class="f" for="fSt">狀態</label><select id="fSt"></select></div>
        <div class="wide2"><label class="f" for="fQ">關鍵字</label><input id="fQ" placeholder="姓名、單號、發票號碼、店家" onkeydown="if(event.key==='Enter')adminSearch()"></div>
      </div>
      <div class="bar">
        <button class="btn sm" onclick="adminSearch()">查詢</button>
        <button class="btn sm sec" onclick="exportExcel()">匯出 Excel</button>
        <button class="btn sm sec" id="batchBtn" onclick="batchPaid()">標記已付款（已勾選 0）</button>
        <button class="btn sm sec hidden" id="extBtn" onclick="openExternal()">用瀏覽器開啟</button>
      </div>
    </div>
    <div class="sumline" id="adminSum"></div>
    <div id="adminList"></div>
  </div>

  <div id="v-detail" class="hidden">
    <button class="back" onclick="goBack()">‹ 返回</button>
    <div id="detailBody"></div>
  </div>
</main>

<nav id="nav" class="hidden">
  <button class="tab" data-v="apply" onclick="show('apply')">申請</button>
  <button class="tab" data-v="mine" onclick="show('mine')">我的申請</button>
  <button class="tab hidden" data-v="pending" id="tabPending" onclick="show('pending')">待我簽核<span class="badge hidden" id="badge"></span></button>
  <button class="tab hidden" data-v="admin" id="tabAdmin" onclick="show('admin')">管理</button>
</nav>

<script>
/* ===== 設定：換成你的值 ===== */
const LIFF_ID = '2012066652-7rIy3tux';
const API_URL = 'https://script.google.com/macros/s/AKfycby5HqwWlGEihTCZUQn36sIPPL3R3vcUeJZJs6UCWV1G9pxUqHVmRBL6mCmnwc20g4Eg3g/exec';
/* =========================== */

let idToken = null, ME = null, current = 'apply', lastList = 'mine', fromLink = false, autoPdf = false;
const inLineApp = () => !!(window.liff && liff.isInClient && liff.isInClient());
let photos = [];   // { url, status: 'reading'|'done'|'fail', result, warnings, error }
const dirty = { amount:false, date:false, category:false, desc:false };
const adminState = { inited:false, list:[], total:0, dirty:true, selected:new Set() };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('en-US');
const amountValue = () => Number($('#aAmount').value.replace(/,/g, '')) || 0;

async function api(action, data){
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action, data, idToken }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '發生錯誤');
  return j;
}

/** 頁面內的確認框（取代瀏覽器內建 confirm，不會顯示網址） */
function ask(msg, okLabel = '確定', tone = ''){
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.className = 'dlg-bg';
    bg.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><p>${esc(msg)}</p>
      <div class="btnrow"><button class="btn cancel">取消</button><button class="btn ${tone}">${esc(okLabel)}</button></div></div>`;
    const done = v => { bg.remove(); resolve(v); };
    const [cancel, ok] = bg.querySelectorAll('button');
    cancel.onclick = () => done(false);
    ok.onclick = () => done(true);
    bg.onclick = e => { if (e.target === bg) done(false); };
    document.body.appendChild(bg);
    ok.focus();
  });
}

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}

function showError(msg){
  ['loading','bind','apply','mine','pending','detail','admin'].forEach(v => $('#v-'+v).classList.add('hidden'));
  $('#errMsg').textContent = msg; $('#v-error').classList.remove('hidden');
}

function params(){
  const p = new URLSearchParams(location.search);
  const st = p.get('liff.state');
  if (st){
    const q = st.includes('?') ? st.split('?')[1] : st.replace(/^\?/, '');
    new URLSearchParams(q).forEach((v,k) => p.set(k,v));
  }
  return p;
}

async function boot(){
  try{
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    if (!idToken) throw new Error('取不到 LINE 登入資訊，請確認 LIFF 的 Scope 有勾選 openid。');
    const p = params();
    const wantDetail = p.get('mode') === 'detail' && p.get('id');
    const pre = wantDetail ? api('detail', { id: p.get('id') }) : null;
    if (pre) pre.catch(() => {});
    const me = await api('me');
    $('#v-loading').classList.add('hidden');
    if (!me.bound){ $('#v-bind').classList.remove('hidden'); return; }
    applyMe(me);
    autoPdf = p.get('pdf') === '1' && !inLineApp();
    if (wantDetail) openDetail(p.get('id'), true, pre);
    else if (p.get('mode') === 'admin' && me.isAdmin) show('admin');
    else show(p.get('mode') === 'pending' && me.isApprover ? 'pending' : (p.get('mode') === 'mine' ? 'mine' : 'apply'));
  }catch(e){ showError(e.message); }
}

function applyMe(me){
  ME = me;
  $('#who').textContent = `${me.me.name}・${me.me.dept}`;
  $('#nav').classList.remove('hidden');
  $('#tabPending').classList.toggle('hidden', !me.isApprover);
  $('#tabAdmin').classList.toggle('hidden', !me.isAdmin);
  setBadge(me.pendingCount);
  $('#aType').innerHTML = me.types.map((t,i) =>
    `<label><input type="radio" name="type" value="${esc(t)}" ${i===0?'checked':''}><span>${esc(t)}</span></label>`).join('');
  $('#aCat').innerHTML = '<option value="">請選擇</option>' + me.categories.map(c => `<option>${esc(c)}</option>`).join('');
  resetForm();
}

function setBadge(n){ const b = $('#badge'); b.textContent = n; b.classList.toggle('hidden', !n); }

function show(v){
  current = v;
  ['bind','apply','mine','pending','detail','error','admin'].forEach(x => $('#v-'+x).classList.toggle('hidden', x !== v));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  document.body.classList.toggle('wide', v === 'admin' || (v === 'detail' && lastList === 'admin'));
  $('#title').textContent = { apply:'申請費用', mine:'我的申請', pending:'待我簽核', detail:'申請明細', admin:'單據管理' }[v] || '費用簽核';
  if (v === 'mine') loadList('myList', '#mineList', false);
  if (v === 'pending') loadList('pendingList', '#pendList', true);
  if (v === 'admin'){
    lastList = 'admin';
    if (!adminState.inited) adminInit();
    if (adminState.dirty) adminSearch();
  }
  window.scrollTo(0,0);
}

/* ===== 綁定 ===== */
async function doBind(){
  const btn = $('#bBtn'); btn.disabled = true; btn.textContent = '綁定中…';
  try{
    const me = await api('bind', { empId: $('#bEmp').value.trim(), code: $('#bCode').value.trim() });
    $('#v-bind').classList.add('hidden'); applyMe(me); show('apply'); toast('綁定完成');
  }catch(e){ toast(e.message); }
  btn.disabled = false; btn.textContent = '綁定';
}

/* ===== 申請表單 ===== */
function resetForm(){
  photos = [];
  Object.keys(dirty).forEach(k => dirty[k] = false);
  $('#aAmount').value = ''; $('#aDesc').value = ''; $('#aCat').value = '';
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  $('#aDate').value = d.toISOString().slice(0,10);
  const first = document.querySelector('input[name=type]'); if (first) first.checked = true;
  renderPhotos(); renderCheck();
}

$('#aAmount').addEventListener('input', e => {
  const n = e.target.value.replace(/[^\d]/g, '');
  e.target.value = n ? Number(n).toLocaleString('en-US') : '';
  dirty.amount = true; renderCheck();
});
$('#aDate').addEventListener('input', () => dirty.date = true);
$('#aCat').addEventListener('change', () => dirty.category = true);
$('#aDesc').addEventListener('input', () => dirty.desc = true);

function renderPhotos(){
  const max = ME ? ME.maxPhotos : 5;
  let html = photos.map((p,i) => {
    let cap = '';

    else if (p.status === 'fail') cap = '<div class="cap fail">請手動填寫</div>';
    else if (p.result) cap = `<div class="cap">${p.result.source === 'qr' ? '電子發票' : 'AI'}　NT$ ${money(p.result.amount)}</div>`;
    return `<div class="photo"><img src="${p.url}" alt="收據 ${i+1}" onclick="viewImg(this.src)">${cap}<button aria-label="移除" onclick="removePhoto(${i})">×</button></div>`;
  }).join('');
  if (photos.length < max) html += `<label class="add" for="aFile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>拍收據</label>`;
  $('#photos').innerHTML = html;
  $('#photoCount').textContent = photos.length ? `（${photos.length}/${max}）` : '';
}

function removePhoto(i){ photos.splice(i,1); renderPhotos(); autofill(); }

$('#aFile').addEventListener('change', async e => {
  const max = ME ? ME.maxPhotos : 5;
  const files = [...e.target.files].slice(0, max - photos.length);
  e.target.value = '';
  for (const f of files){
    try{
      const canvas = await loadCanvas(f);
      const p = { url: canvas.toDataURL('image/jpeg', 0.8), status: 'reading' };
      photos.push(p); renderPhotos(); renderCheck();
      recognize(p, canvas);
    }catch(err){ toast(err.message); }
  }
});

function loadCanvas(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c);
    };
    img.onerror = () => rej(new Error('無法讀取圖片：' + file.name));
    img.src = url;
  });
}

function smallJpeg(canvas, max){
  const s = Math.min(1, max / Math.max(canvas.width, canvas.height));
  if (s === 1) return canvas.toDataURL('image/jpeg', 0.75);
  const c = document.createElement('canvas');
  c.width = Math.round(canvas.width * s); c.height = Math.round(canvas.height * s);
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.75);
}

async function recognize(p, canvas){
  await new Promise(r => setTimeout(r, 30)); // 先讓「辨識中」顯示出來
  let qr = null;
  try{ qr = scanInvoice(canvas); }catch(e){ qr = null; }
  try{
    const r = await api('ocr', { image: smallJpeg(canvas, 1024).split(',')[1], qr });
    if (!photos.includes(p)) return;
    p.status = 'done'; p.result = r.result; p.warnings = r.warnings || [];
  }catch(e){
    if (!photos.includes(p)) return;
    if (qr){ // AI 失敗但 QR 讀到了，照樣可用
      p.status = 'done';
      p.result = { source:'qr', ...qr, seller:'', category:'', summary: qr.items.slice(0,3).map(i=>i.name).join('、'), confidence:'high', isReceipt:true };
      p.warnings = [];
    } else { p.status = 'fail'; p.error = e.message; }
  }
  renderPhotos(); autofill();
}

function autofill(){
  const done = photos.filter(p => p.status === 'done' && p.result);
  if (done.length){
    const sum = done.reduce((s,p) => s + (Number(p.result.amount) || 0), 0);
    if (!dirty.amount && sum) $('#aAmount').value = money(sum);
    const first = done[0].result;
    if (!dirty.date && first.date) $('#aDate').value = first.date;
    if (!dirty.category && first.category) $('#aCat').value = first.category;
    if (!dirty.desc) $('#aDesc').value = done.map(p => p.result.summary || p.result.seller).filter(Boolean).join('、');
  }
  renderCheck();
}

function renderCheck(){
  const box = $('#ocrBox');
  if (!photos.length){ box.innerHTML = ''; return; }
  const rows = photos.map((p,i) => {
    if (p.status === 'reading') return `<li><b>收據 ${i+1}</b>　辨識中…</li>`;
    if (p.status === 'fail') return `<li><b>收據 ${i+1}</b>　無法自動辨識，請手動填寫金額<br><span>${esc(p.error || '')}</span></li>`;
    const r = p.result;
    const meta = [r.seller, r.sellerTaxId && ('賣方統編 ' + r.sellerTaxId),
      r.buyerTaxId && !/^0+$/.test(r.buyerTaxId) && ('買方統編 ' + r.buyerTaxId), r.invoiceNo, r.date].filter(Boolean).join('　');
    const items = (r.items || []).slice(0,5).map(it => it.name + (it.qty > 1 ? '×' + it.qty : '')).join('、');
    return `<li><b>收據 ${i+1}</b>　${r.source === 'qr' ? '電子發票' : 'AI 辨識'}　NT$ ${money(r.amount)}`
      + (meta ? `<br><span>${esc(meta)}</span>` : '') + (items ? `<br><span>${esc(items)}</span>` : '') + '</li>';
  }).join('');
  const warns = photos.filter(p => p.status === 'done').flatMap(p => p.warnings || []);
  const done = photos.filter(p => p.status === 'done' && p.result);
  const sum = done.reduce((s,p) => s + (Number(p.result.amount) || 0), 0);
  if (sum && amountValue() && sum !== amountValue()) warns.push(`金額和收據辨識合計 NT$ ${money(sum)} 不同，主管簽核時會看到這個提醒`);
  box.innerHTML = `<ul class="recog">${rows}</ul>` + (warns.length ? `<ul class="warn">${warns.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : '');
}

/* ===== 電子發票 QR code 解讀 ===== */
function latin1(arr){ let s = ''; for (const c of arr) s += String.fromCharCode(c); return s; }

function scanInvoice(canvas){
  if (typeof jsQR !== 'function') return null;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const W = canvas.width, H = canvas.height;
  // 兩個 QR 並排時 jsQR 一次只讀一個，所以分區域掃描
  const regions = [[0,0,1,1],[0,0,.55,1],[.45,0,.55,1],[0,.35,.55,.65],[.45,.35,.55,.65],[0,.5,1,.5]];
  let left = null, right = null;
  for (const [rx,ry,rw,rh] of regions){
    const x = Math.round(rx*W), y = Math.round(ry*H), w = Math.round(rw*W), h = Math.round(rh*H);
    const img = ctx.getImageData(x, y, w, h);
    const code = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
    if (!code || !code.binaryData || code.binaryData.length < 10) continue;
    const b = code.binaryData;
    if (b[0] === 42 && b[1] === 42) right = right || b;
    else if (/^[A-Z]{2}\d{15}/.test(latin1(b.slice(0,17)))) left = left || b;
    if (left && right) break;
  }
  return left ? parseInvoice(left, right) : null;
}

function parseInvoice(left, right){
  const h = latin1(left.slice(0,77));
  const invoiceNo = h.slice(0,10), roc = h.slice(10,17);
  const year = Number(roc.slice(0,3)) + 1911;
  const date = `${year}-${roc.slice(3,5)}-${roc.slice(5,7)}`;
  const amount = parseInt(h.slice(29,37), 16);
  if (!(year > 2000) || !Number.isFinite(amount)) return null;

  const rest = left.slice(77);
  const enc = latin1(rest).split(':')[4];
  const decode = bytes => {
    try{ return new TextDecoder(enc === '0' ? 'big5' : 'utf-8').decode(new Uint8Array(bytes)); }
    catch(e){ return latin1(bytes); }
  };
  let itemStr = decode(rest).split(':').slice(5).join(':').replace(/:+$/, '');
  if (right) itemStr += ':' + decode(right.slice(2)).replace(/^:+/, '').replace(/:+$/, '');
  if (enc === '2'){
    try{ itemStr = new TextDecoder('utf-8').decode(Uint8Array.from(atob(itemStr.replace(/:/g, '')), c => c.charCodeAt(0))); }
    catch(e){ itemStr = ''; }
  }
  const f = itemStr.split(':'), items = [];
  for (let i = 0; i + 2 < f.length; i += 3){
    const name = (f[i] || '').trim();
    if (name) items.push({ name, qty: Number(f[i+1]) || 1, price: Number(f[i+2]) || 0 });
  }
  return { invoiceNo, date, amount, buyerTaxId: h.slice(37,45), sellerTaxId: h.slice(45,53), items };
}

async function doSubmit(){
  if (photos.some(p => p.status === 'reading')) return toast('收據還在辨識中，請稍候');
  const data = {
    type: (document.querySelector('input[name=type]:checked') || {}).value,
    amount: amountValue(),
    date: $('#aDate').value,
    category: $('#aCat').value,
    desc: $('#aDesc').value,
    receipts: photos.map(p => {
      const r = (p.status === 'done' && p.result) || {};
      return {
        photo: p.url.split(',')[1],
        source: p.status === 'done' ? r.source : 'manual',
        invoiceNo: r.invoiceNo || '', seller: r.seller || '',
        sellerTaxId: r.sellerTaxId || '', buyerTaxId: r.buyerTaxId || '',
        amount: r.amount || 0, confidence: r.confidence || '', isReceipt: r.isReceipt !== false
      };
    })
  };
  if (!photos.length) return toast('請至少上傳一張收據照片');
  if (!(data.amount > 0)) return toast('請填寫金額');
  if (!data.category) return toast('請選擇類別');
  const btn = $('#aBtn'); btn.disabled = true; btn.textContent = '送出中…';
  try{
    const r = await api('submit', data);
    toast(`已送出 ${r.id}，等待主管簽核`);
    resetForm(); show('mine');
  }catch(e){ toast(e.message); }
  btn.disabled = false; btn.textContent = '送出申請';
}

async function decide(id, result){
  const comment = $('#dComment').value.trim();
  if (result === '退回' && !comment) return toast('退回請填寫原因');
  if (!(await ask(`確定${result}這張申請？`, result, result === '核准' ? 'ok' : 'bad'))) return;
  document.querySelectorAll('.btnrow .btn').forEach(b => b.disabled = true);
  try{
    await api('decide', { id, result, comment });
    toast(`已${result}`);
    show('pending');
  }catch(e){ toast(e.message); document.querySelectorAll('.btnrow .btn').forEach(b => b.disabled = false); }
}

async function withdraw(id, btn){
  if (!(await ask('確定撤回這張申請？撤回後需重新送出。', '撤回', 'bad'))) return;
  btn.disabled = true;
  try{ await api('withdraw', { id }); toast('已撤回'); show('mine'); }
  catch(e){ toast(e.message); btn.disabled = false; }
}

  try{
    const r = await api('markPaid', { ids });
    toast(`已標記 ${r.count} 張為已付款` + (r.skipped && r.skipped.length ? `，${r.skipped.length} 張狀態不符略過` : ''));
    adminState.dirty = true;
    if (current === 'admin') adminSearch(); else openDetail(ids[0]);
  }catch(e){ toast(e.message); }
  btn.disabled = false; updateBatch();
}

async function voidReq(id, btn){
  const reason = $('#vReason').value.trim();
  if (!reason) return toast('請填寫作廢原因');
  if (!(await ask('確定作廢這張單？申請人會收到 LINE 通知，作廢後無法復原。', '作廢', 'bad'))) return;
  btn.disabled = true;
  try{ await api('voidReq', { id, reason }); toast('已作廢'); adminState.dirty = true; openDetail(id); }
  catch(e){ toast(e.message); btn.disabled = false; }
}

async function downloadPdf(id, btn){
  if (inLineApp()){
    if (await ask('LINE 裡無法下載檔案，要改用手機瀏覽器開啟這張單並下載 PDF 嗎？', '用瀏覽器開啟'))
      liff.openWindow({ url: `https://liff.line.me/${LIFF_ID}?mode=detail&id=${encodeURIComponent(id)}&pdf=1`, external: true });
    return;
  }
  const win = window.open('', '_blank');
  if (win) win.document.write('<p style="font-family:sans-serif;padding:20px">簽核單產生中，請稍候…</p>');
  btn.disabled = true; const label = btn.textContent; btn.textContent = '產生中…';
  try{
    const r = await api('pdf', { id });
    const bytes = Uint8Array.from(atob(r.data), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type:'application/pdf' }));
    if (win) win.location.href = url;
    else { const a = document.createElement('a'); a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(e){ if (win) win.close(); toast(e.message); }
  btn.disabled = false; btn.textContent = label;
}

async function exportExcel(){
  if (inLineApp()){
    if (await ask('LINE 裡無法下載檔案，要改用手機瀏覽器開啟管理頁再匯出嗎？', '用瀏覽器開啟')) openExternal();
    return;
  }
  if (typeof XLSX === 'undefined') return toast('Excel 元件載入失敗，請重新整理');
  if (!adminState.list.length) return toast('沒有資料可匯出，請先查詢');
  const cols = ['單號','申請時間','公司','部門','員工編號','姓名','單別','費用日期','類別','說明','店家','賣方統編','買方統編','發票號碼',
    '申請金額','核准金額','辨識金額','狀態','檢核備註','簽核紀錄','結案時間','付款時間','付款標記人','作廢時間','作廢人','作廢原因'];
  const rows = adminState.list.map(r => {
    const o = {};
    cols.forEach(c => { const k = c === '店家' ? '賣方' : c; let v = r[k] ?? ''; if (['申請金額','核准金額','辨識金額'].includes(c) && v !== '') v = Number(v); o[c] = v; });
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(rows, { header: cols });
  ws['!cols'] = cols.map(c => ({ wch: ({'說明':28,'檢核備註':36,'簽核紀錄':44,'申請時間':17,'結案時間':17,'付款時間':17,'作廢時間':17,'作廢原因':24,'發票號碼':14,'店家':18,'賣方統編':11,'買方統編':11}[c] || 11) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '費用簽核');
  XLSX.writeFile(wb, `費用簽核_${$('#fFrom').value || ''}_${$('#fTo').value || ''}.xlsx`);
}

function openExternal(){
  liff.openWindow({ url: `https://liff.line.me/${LIFF_ID}?mode=admin`, external: true });
}

function viewImg(src){
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<img src="${src}" alt="收據">`; v.onclick = () => v.remove();
  document.body.appendChild(v);
}

boot();
</script>
